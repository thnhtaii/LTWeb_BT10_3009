<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Spring Boot REST API with ajax</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .starter-template {
            padding: 40px 20px;
            text-align: center;
            max-width: 600px;
            margin: 60px auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        #images {
            border-radius: 50%;
            margin: 15px auto;
            border: 3px solid #0d6efd;
            object-fit: cover;
        }
        #profile {
            font-size: 1.25rem;
            font-weight: bold;
            margin: 20px 0;
            color: #333;
        }
    </style>
</head>
<body>
<div class="container" style="min-height: 500px">
    <div class="starter-template">
        <h2 class="mb-4">Spring Boot REST API with AJAX Example</h2>
        <div>
            <img id="images" src="https://ui-avatars.com/api/?name=User&background=0d6efd&color=fff" alt="Avatar" width="100" height="100">
        </div>
        <div id="profile" class="alert alert-info">Đang tải thông tin...</div>
        <div>
            <button id="logout" class="btn btn-danger px-4">Logout</button>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
