<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hồ sơ người dùng - Spring Boot REST API</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            color: #1e293b;
        }
        .profile-container {
            max-width: 900px;
            margin: 40px auto;
            background: #ffffff;
            border-radius: 12px;
            padding: 35px 40px;
            box-shadow: 0 4px 25px rgba(0, 0, 0, 0.04);
            border: 1px solid #e2e8f0;
        }
        .sub-header {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #0284c7;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        .main-title {
            font-size: 1.75rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 25px;
        }
        .avatar-circle {
            width: 75px;
            height: 75px;
            background-color: #3b82f6;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            flex-shrink: 0;
        }
        .user-fullname {
            font-size: 1.35rem;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 2px;
        }
        .user-email {
            font-size: 0.95rem;
            color: #64748b;
            margin-bottom: 0;
        }
        .btn-action {
            font-weight: 500;
            padding: 7px 18px;
            border-radius: 6px;
        }
        .table {
            margin-top: 20px;
            font-size: 0.95rem;
        }
        .table thead th {
            color: #475569;
            font-weight: 600;
            border-bottom: 2px solid #e2e8f0;
            padding: 12px 10px;
        }
        .table tbody td {
            padding: 14px 10px;
            color: #1e293b;
            border-bottom: 1px solid #f1f5f9;
        }
        pre code {
            font-size: 0.85rem;
            color: #334155;
            font-family: SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
        .json-box {
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 15px;
            max-height: 250px;
            overflow-y: auto;
        }
        details summary {
            cursor: pointer;
            font-weight: 600;
            color: #334155;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="profile-container">
        <!-- Subheader badge -->
        <div class="sub-header">Spring Boot REST API · AJAX · Nimbus</div>
        
        <!-- Main Title -->
        <h1 class="main-title">Hồ sơ người dùng</h1>

        <!-- User Info Header -->
        <div class="d-flex align-items-center mb-4">
            <div id="avatar-container" class="me-3">
                <div class="avatar-circle">
                    <i class="bi bi-person-fill"></i>
                </div>
            </div>
            <div>
                <div class="user-fullname" id="user-fullname">Đang tải...</div>
                <div class="user-email" id="user-email">...</div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="d-flex gap-2 mb-4">
            <button id="btn-load-users" class="btn btn-primary btn-action">Xem danh sách người dùng</button>
            <button id="logout" class="btn btn-outline-secondary btn-action">Đăng xuất</button>
        </div>

        <!-- Users Table -->
        <div id="users-section" class="mt-4 mb-4">
            <table class="table">
                <thead>
                    <tr>
                        <th style="width: 10%;">ID</th>
                        <th style="width: 40%;">Họ tên</th>
                        <th style="width: 50%;">Email</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <!-- Dynamic Rows Loaded by AJAX -->
                </tbody>
            </table>
        </div>

        <!-- Raw JSON Preview Accordion -->
        <details class="mt-4" open>
            <summary>Dữ liệu hồ sơ từ API</summary>
            <div class="json-box">
                <pre class="mb-0"><code id="json-preview">Đang nạp dữ liệu...</code></pre>
            </div>
        </details>
    </div>
</div>

<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
<script src="/js/mainjs.js"></script>
</body>
</html>
